name: "커피고래의 노트"
title: "커피고래의 노트"
description: "쿠버네티스, MLOps, 컨테이너 네트워크와 인증까지 직접 공부하고 운영하며 정리한 커피고래의 기술 블로그"
tagline: "쿠버네티스 · MLOps 기술 블로그"
repository: hongkunyoo/hongkunyoo.github.io
meta_description: "쿠버네티스, MLOps, 컨테이너 네트워크와 인증까지 직접 공부하고 운영하며 정리한 커피고래의 기술 블로그"
email: hongkunyoo@gmail.com
timezone: Asia/Seoul
# baseurl: 
domain_name: 'https://coffeewhale.com'
url: 'https://coffeewhale.com'
permalink: pretty
logo: 'assets/images/logo.png'
favicon: 'assets/images/favicon.png'
author: hongkunyoo
paginate: 12
encoding: utf-8
locale: ko_KR
lang: ko
feed_items: 5
future: true
# feed_update_period: daily
# feed_update_frequency: 1
highlighter: rouge
markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true
  syntax_highlighter: rouge
defaults:
  # Posts defaults
  - scope:
      path: "" # an empty string here means all files in the project
      type: posts # Apply the default values below only to posts
    values:
      image: /assets/images/landing/landing.png
  - scope:
      path: "about/**/*.pdf"
    values:
      sitemap: false
  - scope:
      path: "about/item.html"
    values:
      sitemap: false
  # 유틸리티/인증용 파일은 검색 색인에서 제외
  - scope:
      path: "line.html"
    values:
      sitemap: false
  - scope:
      path: "rate.html"
    values:
      sitemap: false
  - scope:
      path: "naver3964f9de700c9aeb5b75c825d67ffa3a.html"
    values:
      sitemap: false
sass:
  sass_dir: _sass
  style: :compressed
ganalytics: G-09CC3KT77V

# Authors
authors:
  hongkunyoo:
    name: hongkunyoo
    display_name: hongkunyoo
    email: hongkunyoo@gmail.com
    web: https://coffeewhale.com
    description: "커피고래"

